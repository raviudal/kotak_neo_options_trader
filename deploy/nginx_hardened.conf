# Rate Limiting Zones (DDoS and brute-force protection)
# ==============================================================================
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

# HTTP on Port 80 and Port 8080: Redirect to Secure HTTPS
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    listen 8080;
    listen [::]:8080;
    server_name 34.27.55.202.sslip.io 34.27.55.202 localhost _;

    server_tokens off;
    return 301 https://34.27.55.202.sslip.io$request_uri;
}

# HTTPS on Port 443: Full TLS Encryption, Hardening Headers & WebSockets
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 34.27.55.202.sslip.io 34.27.55.202 localhost _;

    ssl_certificate /etc/letsencrypt/live/34.27.55.202.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34.27.55.202.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    server_tokens off;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block bot probing for PHP, Git, Env, and common exploit paths
    location ~* \.(php|aspx|asp|jsp|cgi|pl|git|env|bak|sql|tar|gz)$ {
        return 404;
    }

    # Strict rate-limiting on authentication endpoints (brute-force defense)
    location /api/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/auth/register {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Main Application & WebSocket endpoint
    location / {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
